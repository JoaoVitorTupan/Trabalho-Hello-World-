name: CI / Deploy da Aplicação

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    name: Build e Validação (Node.js & Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Executar aplicação com Node.js
        run: npm start

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        run: docker build -t hello-world-node:latest .

      - name: Executar container Docker
        run: docker run --rm hello-world-node:latest
